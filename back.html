<div class="card-container">

  <!-- Normal (always-visible) tags -->
  <div class="tag-container" id="tagContainer"></div>

  <!-- qt* tags above the question -->
  <div class="tag-container tag-container--question" id="qtContainer"></div>
  <div class="front-card">{{Front}}</div>

  <!-- at* tags above the answer (only shown on back) -->
  <div class="tag-container tag-container--answer" id="atContainer"></div>
  <div class="common-card">{{Back}}</div>

  {{#Extra}}
  <div class="common-card">
    <div class="subtitle subtitle--extra"></div>
    <div class="reminder reminder--extra"></div>
    {{Extra}}
  </div>
  {{/Extra}}

  {{#Hint}}
  <div class="common-card">
    <div class="subtitle subtitle--hint"></div>
    {{Hint}}
  </div>
  {{/Hint}}

  {{#Source}}
  <div class="common-card">
    <div class="subtitle subtitle--source"></div>
    {{Source}}
  </div>
  {{/Source}}

</div>

<span hidden id="tagSource">{{Tags}}</span>

<span hidden id="deckSource">{{Deck}}</span>

<script>
/* ============================================================
   TAG RENDERING – BACK
   ------------------------------------------------------------
   normal tags    -> #tagContainer
   qt* (prefix)   -> #qtContainer (above question)
   ::at (suffix)  -> #atContainer (above answer)
   hid* (prefix)  -> never shown
   leech          -> always shown FIRST (special color)

   Custom colors:
   deck::#728378|biology
   deck::#728378|biology::cells
   deck::#728378|biology::at
   qt_#728378|biology
============================================================ */

(() => {
  const tagSourceEl = document.getElementById("tagSource");
  const normalEl = document.getElementById("tagContainer");
  const qtEl = document.getElementById("qtContainer");
  const atEl = document.getElementById("atContainer");

  if (!tagSourceEl || !normalEl || !qtEl || !atEl) return;

  const raw = (tagSourceEl.textContent || "").trim();
  if (!raw) return;

  const PREFIX = {
    qt: /^qt(?:[:\-_ ]+|$)/i,
    hid: /^hid(?:[:\-_ ]+|$)/i
  };

  const stripPrefix = (s) =>
    s.replace(/^(qt|hid)(?:[:\-_ ]+|$)/i, "").trim();

  const parseStyledLabel = (str) => {
    const match = str.match(
      /^(#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}))\|(.*)$/
    );

    if (match) {
      return {
        color: match[1],
        label: match[2].replace(/_/g, " ").trim()
      };
    }

    return {
      color: null,
      label: str.replace(/_/g, " ").trim()
    };
  };

  const getInheritedColor = (parts) => {
    let activeColor = null;

    for (const part of parts) {
      const parsed = parseStyledLabel(part);
      if (parsed.color) activeColor = parsed.color;
    }

    return activeColor;
  };

  const tokens = raw.split(/\s+/).filter(Boolean);

  const normal = [];
  const qt = [];
  const at = [];

  for (const token of tokens) {
    const parts = token.split("::").filter(Boolean);
    if (!parts.length) continue;

    let activeColor = getInheritedColor(parts);

    const lastRaw = parts[parts.length - 1];
    const last = lastRaw.toLowerCase();

    if (last === "leech") {
      normal.unshift({
        label: "leech",
        color: null,
        type: "leech"
      });
      continue;
    }

    if (PREFIX.hid.test(lastRaw)) continue;

    if (PREFIX.qt.test(lastRaw)) {
      const cleaned = stripPrefix(lastRaw);
      const parsed = parseStyledLabel(cleaned);

      if (parsed.color) activeColor = parsed.color;

      if (parsed.label) {
        qt.push({
          label: parsed.label,
          color: activeColor,
          type: "question"
        });
      }

      continue;
    }

    if (last === "at") {
      const prevParts = parts.slice(0, -1);
      const prevRaw = prevParts[prevParts.length - 1] || "";
      const parsed = parseStyledLabel(prevRaw);
      const answerColor = getInheritedColor(prevParts);

      if (parsed.label) {
        at.push({
          label: parsed.label,
          color: answerColor,
          type: "answer"
        });
      }

      continue;
    }

    const parsed = parseStyledLabel(lastRaw);

    if (parsed.label) {
      normal.push({
        label: parsed.label,
        color: activeColor,
        type: "normal"
      });
    }
  }

  const addPills = (container, items) => {
    if (!items.length) return;

    const frag = document.createDocumentFragment();

    for (const item of items) {
      const el = document.createElement("div");

      el.className = `tags tags--${item.type}`;
      el.textContent = item.label;

      if (item.color) {
        el.style.backgroundColor = item.color;
      }

      frag.appendChild(el);
    }

    container.appendChild(frag);
  };

  addPills(normalEl, normal);
  addPills(qtEl, qt);
  addPills(atEl, at);

  if (!normalEl.children.length) normalEl.style.display = "none";
  if (!qtEl.children.length) qtEl.style.display = "none";
  if (!atEl.children.length) atEl.style.display = "none";
})();
</script>

<script>
(() => {
  const deckEl = document.getElementById("deckSource");
  const container = document.querySelector(".card-container");

  if (!deckEl || !container) return;

  const deck = (deckEl.textContent || "").toLowerCase();

  const rules = [
    ["critical thinking", "subject-critical"],
    ["art", "subject-arts"],
    ["music", "subject-arts"],
    ["visual arts", "subject-arts"],
    ["cultural practices", "subject-arts"],
    ["ethnicities", "subject-arts"],
    ["false belief systems", "subject-arts"],
    ["language skills", "subject-languages"],
    ["french", "subject-languages"],
    ["japanese", "subject-languages"],
    ["dutch", "subject-languages"],
    ["english", "subject-languages"],
    ["governance & territory", "subject-governance"],
    ["geographic names", "subject-governance"],
    ["human rights", "subject-governance"],
    ["state organization", "subject-governance"],
    ["current affairs", "subject-governance"],
    ["history", "subject-history"],
    ["human systems sciences", "subject-systems"],
    ["software programming", "subject-systems"],
    ["bookkeeping", "subject-systems"],
    ["engineering", "subject-systems"],
    ["macroeconomics", "subject-systems"],
    ["inorganic sciences", "subject-inorganic"],
    ["organic sciences", "subject-organic"],
    ["animals", "subject-organic"],
    ["plants", "subject-organic"],
    ["human body", "subject-organic"],
    ["biochemistry", "subject-organic"]
  ];

  for (const [needle, className] of rules) {
    if (deck.includes(needle)) {
      container.classList.add(className);
      return;
    }
  }

  container.classList.add("subject-default");
})();
</script>
