<div class="card-container">
   <!-- Normal orientation tags + deck icon -->

<div class="tag-container" id="tagContainer">
  <div class="deck-icon-badge" id="deckIconBadge" hidden>
    <img id="deckIcon" class="deck-icon" alt="" hidden>
  </div>
</div>

  <!-- Standard question (__q#hex) -->
  <div class="front-card" id="front-text">{{Front}}</div>
  <div class="tag-container tag-container--answer" id="atContainer"></div>
  <div class="common-card">{{Back}}</div>

  {{#Pronounciation}}
  <div class="common-card">
    <div class="subtitle subtitle--pronounciation"></div>
    {{Pronounciation}}
  </div>
  {{/Pronounciation}}

  {{#Extra}}
  <div class="common-card">
    <div class="subtitle subtitle--extra"></div>
    <div class="reminder reminder--extra"></div>
    {{Extra}}
  </div>
  {{/Extra}}

  {{#Image}}
  <div class="common-card">
    {{Image}}
  </div>
  {{/Image}}



  {{#Hint}}
  <div class="common-card">
    <div class="subtitle subtitle--hint"></div>
    {{Hint}}
  </div>
  {{/Hint}}

  {{#Source}}
  <div class="common-card">
    <div class="subtitle subtitle--source"></div>
    {{Source}}
  </div>
  {{/Source}}




</div>

<span hidden id="tagSource">{{Tags}}</span>

<span hidden id="deckSource">{{Deck}}</span>

<script>
  (() => {

    const tagSourceEl =
      document.getElementById("tagSource");

    const deckSourceEl =
      document.getElementById("deckSource");

    const normalEl =
      document.getElementById("tagContainer");

    const questionEl =
      document.getElementById("front-text");

    const deckIconEl =
      document.getElementById("deckIcon");

    const container =
      document.querySelector(".card-container");


    if (
      !tagSourceEl ||
      !deckSourceEl ||
      !normalEl ||
      !questionEl ||
      !deckIconEl ||
      !container
    ) return;


    const raw =
      (tagSourceEl.textContent || "").trim();

    const deckRaw =
      (deckSourceEl.textContent || "").trim();


    const PREFIX = {
      hid: /^hid(?:[:\-_ ]+|$)/i
    };


    /*
     * t = normal tag colour
     * s = sidebar colour
     * q = standard-question colour
     */
    const STYLE =
      /__(t|s|q)#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})(?=__|$)/g;


    const TAG_NONE =
      /__t_none(?=__|$)/gi;


    /*
     * Used when comparing a deck name to the deck name
     * stored inside a metadata tag.
     *
     * For example:
     *
     * "False Belief Systems"
     *
     * matches:
     *
     * "False_Belief_Systems"
     */
    const normalizeKey = (str) =>
      str
        .trim()
        .toLowerCase()
        .replace(/[\s_]+/g, "_");


    const parseStyledLabel = (str) => {

      let tagColor = null;
      let sidebarColor = null;
      let questionColor = null;
      let hideTag = false;


      const label = str

        .replace(TAG_NONE, () => {
          hideTag = true;
          return "";
        })

        .replace(STYLE, (_, type, hex) => {

          const color = "#" + hex;

          type = type.toLowerCase();


          if (type === "t") {
            tagColor = color;
          }

          if (type === "s") {
            sidebarColor = color;
          }

          if (type === "q") {
            questionColor = color;
          }


          return "";
        })

        .replace(/_/g, " ")

        .trim();


      return {
        label,
        tagColor,
        sidebarColor,
        questionColor,
        hideTag
      };
    };


    /*
     * ---------------------------------------------------------
     * INHERITED STYLES
     * ---------------------------------------------------------
     *
     * t and s can inherit through:
     *
     * Parent::Child::Grandchild
     *
     * with the deepest definition winning.
     *
     * q deliberately DOES NOT inherit.
     *
     * A component is only a standard question if that
     * component itself contains __q#...
     */

    const resolveStyles = (parts) => {

      let tagColor = null;
      let sidebarColor = null;
      let hideTag = false;

      let tagColorDepth = -1;
      let sidebarColorDepth = -1;
      let hideTagDepth = -1;


      parts.forEach((part, index) => {

        const parsed =
          parseStyledLabel(part);


        if (parsed.tagColor) {
          tagColor = parsed.tagColor;
          tagColorDepth = index;
        }


        if (parsed.sidebarColor) {
          sidebarColor = parsed.sidebarColor;
          sidebarColorDepth = index;
        }


        if (parsed.hideTag) {
          hideTag = true;
          hideTagDepth = index;
        }

      });


      return {
        tagColor,
        sidebarColor,
        hideTag,

        tagColorDepth,
        sidebarColorDepth,
        hideTagDepth
      };
    };


    const tokens =
      raw
        ? raw.split(/\s+/).filter(Boolean)
        : [];


    const normal = [];
    const questions = [];


    /*
     * Top-level deck:
     *
     * Science::Biology
     *
     * becomes:
     *
     * Science
     */

    const deckParts =
      deckRaw
        .split("::")
        .map(normalizeKey)
        .filter(Boolean);


    let deckIconName = null;


    /*
     * Sidebar is card-wide.
     * Most specific definition wins.
     */

    let cardSidebarColor = null;
    let cardSidebarDepth = -1;


    for (const token of tokens) {

      const parts =
        token.split("::").filter(Boolean);

      if (!parts.length) continue;


      /*
       * -------------------------------------------------------
       * DECK ICON METADATA
       * -------------------------------------------------------
       *
       * deckicon::Animals::paw-print
       *
       * deckicon::False_Belief_Systems::eye-slash
       *
       * These tags are metadata only and never become
       * visible tag pills.
       */
      if (parts[0].toLowerCase() === "deckicon") {

        if (parts.length >= 3) {

          const iconDeck =
            normalizeKey(parts[1]);

          if (deckParts.includes(iconDeck)) {
            deckIconName = parts[2];
          }
        }

        continue;
      }
      const styles =
        resolveStyles(parts);


      /*
       * Resolve sidebar colour.
       */

      if (
        styles.sidebarColor &&
        styles.sidebarColorDepth > cardSidebarDepth
      ) {

        cardSidebarColor =
          styles.sidebarColor;

        cardSidebarDepth =
          styles.sidebarColorDepth;
      }


      const lastRaw =
        parts[parts.length - 1];

      const parsedLast =
        parseStyledLabel(lastRaw);

      const visibleRaw =
        parsedLast.label;

      const last =
        visibleRaw.toLowerCase();


      /*
       * Leech warning.
       */

      if (last === "leech") {
        container.classList.add("is-leech");
        continue;
      }


      /*
       * Explicit hidden tag.
       */

      if (PREFIX.hid.test(visibleRaw)) {
        continue;
      }


      /*
       * t_none:
       *
       * metadata/sidebar still work,
       * but the tag itself is not displayed.
       */

      if (styles.hideTag) {
        continue;
      }


      /*
       * -------------------------------------------------------
       * STANDARD QUESTION
       * -------------------------------------------------------
       *
       * Presence of __q#HEX means:
       *
       * 1. this is a standard question
       * 2. HEX is its accent colour
       *
       * q is checked ONLY on the final component, so it
       * does not inherit.
       */

      if (parsedLast.questionColor) {

        if (visibleRaw) {

          questions.push({
            label: visibleRaw,
            color: parsedLast.questionColor,
            type: "question"
          });

        }

        continue;
      }


      /*
       * Existing answer-tag exclusion.
       */

      if (last === "at") {
        continue;
      }


      /*
       * Normal orientation tag.
       */

      if (visibleRaw) {

        normal.push({
          label: visibleRaw,
          color: styles.tagColor,
          type: "normal"
        });

      }

    }


    /*
     * ---------------------------------------------------------
     * SIDEBAR
     * ---------------------------------------------------------
     */

    if (cardSidebarColor) {

      container.style.setProperty(
        "--sidebar-color",
        cardSidebarColor
      );

    }


    /*
     * ---------------------------------------------------------
     * DECK ICON
     * ---------------------------------------------------------
     *
     * Example:
     *
     * deckicon::Animals::paw-print
     *
     * loads:
     *
     * _icon_paw-print.svg
     */

    if (deckIconName) {

      deckIconEl.onerror = () => {
        deckIconEl.hidden = true;
        deckIconBadge.hidden = true;
      };

      deckIconEl.onload = () => {
        deckIconEl.hidden = false;
        deckIconBadge.hidden = false;
      };

      deckIconEl.src =
        "_icon_" + deckIconName + ".svg";
    }

    /*
     * ---------------------------------------------------------
     * CREATE TAG ELEMENTS
     * ---------------------------------------------------------
     */


    const addPillsBackwards = (target, items) => {
      for (const item of items) {

        if (item.label.includes("*")) {
          // Insert the original content at the placeholder.
          const parts = item.label.split("*");
          const original = Array.from(target.childNodes);
          const fragment = document.createDocumentFragment();

          parts.forEach((part, index) => {
            fragment.appendChild(document.createTextNode(part));

            if (index < parts.length - 1) {
              for (const node of original) {
                fragment.appendChild(node);
              }
            }
          });

          target.replaceChildren(fragment);

        } else {
          // Preserve Anki's audio playback elements.
          // Preserve Anki's media elements.
const mediaElements = Array.from(
  target.querySelectorAll(
    ".replay-button, .soundLink, audio, img, video"
  )
).filter(el =>
  !el.parentElement?.closest(
    ".replay-button, .soundLink, audio, img, video"
  )
);

// Replace the question text.
target.replaceChildren(
  document.createTextNode(item.label)
);

// Restore the original media elements.
for (const media of mediaElements) {
  target.appendChild(media);
}
        }
      }
    };

    const addPills = (target, items) => {

      if (!items.length) return;


      const frag =
        document.createDocumentFragment();


      for (const item of items) {

        const el =
          document.createElement("div");

        el.className =
          `tags tags--${item.type}`;

        el.textContent =
          item.label;


        /*
         * Normal tag:
         *   colour becomes background.
         *
         * Standard question:
         *   colour becomes accent variable instead.
         */

        if (item.color) {

          if (item.type === "question") {

            el.style.setProperty(
              "--question-color",
              item.color
            );

          } else {

            el.style.backgroundColor =
              item.color;

          }

        }

        frag.appendChild(el);

      }


      target.appendChild(frag);
    };


    addPills(
      normalEl,
      normal
    );


    addPillsBackwards(
      questionEl,
      questions
    );


    /*
     * Hide an empty normal row only if it has neither
     * tags nor a deck icon.
     */

    if (
      !normal.length &&
      deckIconEl.hidden
    ) {
      normalEl.style.display = "none";
    }


  })();
</script>



<script>
document.querySelectorAll("code").forEach(block => {

    let source = block.innerHTML
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/&nbsp;/gi, " ");

    const decoder = document.createElement("textarea");
    decoder.innerHTML = source;
    source = decoder.value;

    const keywords = new Set([
        "and", "as", "assert", "async", "await",
        "break", "class", "continue", "def", "del",
        "elif", "else", "except", "finally", "for",
        "from", "global", "if", "import", "in",
        "is", "lambda", "nonlocal", "not", "or",
        "pass", "raise", "return", "try", "while",
        "with", "yield"
    ]);

    const literals = new Set([
        "True", "False", "None"
    ]);

    const builtins = new Set([
        "abs", "all", "any", "bool", "dict",
        "enumerate", "filter", "float", "input",
        "int", "isinstance", "len", "list", "map",
        "max", "min", "next", "object", "open",
        "print", "range", "repr", "reversed",
        "round", "set", "sorted", "str", "sum",
        "super", "tuple", "type", "zip"
    ]);

    const token =
        /#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|@[A-Za-z_]\w*|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b/g;

    let html = "";
    let last = 0;
    let previous = null;

    for (const match of source.matchAll(token)) {
        html += escapeHtml(source.slice(last, match.index));

        const text = match[0];
        let type = null;

        if (text.startsWith("#"))
            type = "comment";

        else if (text.startsWith('"') || text.startsWith("'"))
            type = "string";

        else if (text.startsWith("@"))
            type = "decorator";

        else if (/^\d/.test(text))
            type = "number";

        else if (previous === "def")
            type = "function";

        else if (previous === "class")
            type = "class";

        else if (keywords.has(text))
            type = "keyword";

        else if (literals.has(text))
            type = "literal";

        else if (builtins.has(text))
            type = "builtin";

        else if (text === "self" || text === "cls")
            type = "special";

        html += type
            ? `<span class="syn-${type}">${escapeHtml(text)}</span>`
            : escapeHtml(text);

        previous = text;
        last = match.index + text.length;
    }
const lines = html.split("\n");

block.innerHTML = lines.map(line => {
    // Get the plain-text version so HTML highlighting
    // doesn't interfere with counting indentation.
    const temp = document.createElement("div");
    temp.innerHTML = line;
    const text = temp.textContent;

    // Count leading spaces
    const match = text.match(/^ */);
    const spaces = match ? match[0].length : 0;

    /*
     * Wrapped text starts:
     *   - 4 characters in for unindented lines
     *   - 4 characters beyond the existing indentation
     */
    const continuation = spaces + 4;

    return `<span class="code-line"
                  style="--continuation:${continuation}ch">${line || "&nbsp;"}</span>`;
}).join("");
});

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
</script>
