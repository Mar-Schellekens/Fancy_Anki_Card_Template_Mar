
<div class="card-container">

  <!-- Normal (always-visible) tags -->
  <div class="tag-container" id="tagContainer"></div>

  <!-- Question tags (qt*) appear directly above the question -->
  <div class="tag-container tag-container--question" id="qtContainer"></div>
  <div class="front-card">{{Front}}</div>
</div>

<span hidden id="tagSource">{{Tags}}</span>


<script>
(() => {
  const tagSourceEl = document.getElementById("tagSource");
  const normalEl = document.getElementById("tagContainer");
  const qtEl = document.getElementById("qtContainer");
  const container = document.querySelector(".card-container");

  if (!tagSourceEl || !normalEl || !qtEl || !container) return;

  const raw = (tagSourceEl.textContent || "").trim();
  if (!raw) return;

  const PREFIX = {
    qt: /^qt(?:[:\-_ ]+|$)/i,
    hid: /^hid(?:[:\-_ ]+|$)/i
  };

  /*
   * Examples:
   *
   * Mediterranean__t#100d69
   * Europe__s#2584a1
   * Something__t#123456__s#abcdef
   * Something__t_none
   */
  const STYLE =
    /__(t|s)#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})(?=__|$)/g;

  const TAG_NONE = /__t_none(?=__|$)/gi;

  const stripPrefix = (s) =>
    s.replace(/^(qt|hid)(?:[:\-_ ]+|$)/i, "").trim();

  const parseStyledLabel = (str) => {
    let tagColor = null;
    let sidebarColor = null;
    let hideTag = false;

    const label = str
      .replace(TAG_NONE, () => {
        hideTag = true;
        return "";
      })
      .replace(STYLE, (_, type, hex) => {
        if (type.toLowerCase() === "t") {
          tagColor = "#" + hex;
        }

        if (type.toLowerCase() === "s") {
          sidebarColor = "#" + hex;
        }

        return "";
      })
      .replace(/_/g, " ")
      .trim();

    return {
      label,
      tagColor,
      sidebarColor,
      hideTag
    };
  };

  /*
   * Walk through a complete tag path and let deeper
   * definitions override higher definitions.
   */
  const resolveStyles = (parts) => {
    let tagColor = null;
    let sidebarColor = null;
    let hideTag = false;

    let tagColorDepth = -1;
    let sidebarColorDepth = -1;
    let hideTagDepth = -1;

    parts.forEach((part, index) => {
      const parsed = parseStyledLabel(part);

      if (parsed.tagColor) {
        tagColor = parsed.tagColor;
        tagColorDepth = index;
      }

      if (parsed.sidebarColor) {
        sidebarColor = parsed.sidebarColor;
        sidebarColorDepth = index;
      }

      if (parsed.hideTag) {
        hideTag = true;
        hideTagDepth = index;
      }
    });

    return {
      tagColor,
      sidebarColor,
      hideTag,
      tagColorDepth,
      sidebarColorDepth,
      hideTagDepth
    };
  };

  const tokens = raw.split(/\s+/).filter(Boolean);

  const normal = [];
  const qt = [];

  /*
   * Sidebar is a card-wide property rather than belonging
   * to an individual pill.
   *
   * If multiple tag paths define one, the most specific
   * sidebar definition wins.
   */
  let cardSidebarColor = null;
  let cardSidebarDepth = -1;

  for (const token of tokens) {
    const parts = token.split("::").filter(Boolean);
    if (!parts.length) continue;

    const styles = resolveStyles(parts);

    if (
      styles.sidebarColor &&
      styles.sidebarColorDepth > cardSidebarDepth
    ) {
      cardSidebarColor = styles.sidebarColor;
      cardSidebarDepth = styles.sidebarColorDepth;
    }

    const lastRaw = parts[parts.length - 1];

    /*
     * Use the visible portion for special-tag checks,
     * so metadata doesn't interfere.
     */
    const parsedLast = parseStyledLabel(lastRaw);
    const visibleRaw = parsedLast.label;
    const last = visibleRaw.toLowerCase();

    if (last === "leech") {
      container.classList.add("is-leech");
      continue;
    }

    if (PREFIX.hid.test(visibleRaw)) continue;

    /*
     * t_none means:
     * keep processing metadata/sidebar,
     * but do not create a visible tag box.
     */
    if (styles.hideTag) continue;

    if (PREFIX.qt.test(visibleRaw)) {
      const cleaned = stripPrefix(visibleRaw);

      if (cleaned) {
        qt.push({
          label: cleaned,
          color: styles.tagColor,
          type: "question"
        });
      }

      continue;
    }

    if (last === "at") continue;

    if (visibleRaw) {
      normal.push({
        label: visibleRaw,
        color: styles.tagColor,
        type: "normal"
      });
    }
  }

  /*
   * Make sidebar color available to CSS.
   */
  if (cardSidebarColor) {
    container.style.setProperty(
      "--sidebar-color",
      cardSidebarColor
    );
  }

  const addPills = (container, items) => {
    if (!items.length) return;

    const frag = document.createDocumentFragment();

    for (const item of items) {
      const el = document.createElement("div");
      el.className = `tags tags--${item.type}`;
      el.textContent = item.label;

      if (item.color) {
        el.style.backgroundColor = item.color;
      }

      frag.appendChild(el);
    }

    container.appendChild(frag);
  };

  addPills(normalEl, normal);
  addPills(qtEl, qt);

  if (!normalEl.children.length) normalEl.style.display = "none";
  if (!qtEl.children.length) qtEl.style.display = "none";
})();
</script>
<script>
document.querySelectorAll("code").forEach(block => {

    let source = block.innerHTML
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/&nbsp;/gi, " ");

    const decoder = document.createElement("textarea");
    decoder.innerHTML = source;
    source = decoder.value;

    const keywords = new Set([
        "and", "as", "assert", "async", "await",
        "break", "class", "continue", "def", "del",
        "elif", "else", "except", "finally", "for",
        "from", "global", "if", "import", "in",
        "is", "lambda", "nonlocal", "not", "or",
        "pass", "raise", "return", "try", "while",
        "with", "yield"
    ]);

    const literals = new Set([
        "True", "False", "None"
    ]);

    const builtins = new Set([
        "abs", "all", "any", "bool", "dict",
        "enumerate", "filter", "float", "input",
        "int", "isinstance", "len", "list", "map",
        "max", "min", "next", "object", "open",
        "print", "range", "repr", "reversed",
        "round", "set", "sorted", "str", "sum",
        "super", "tuple", "type", "zip"
    ]);

    const token =
        /#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|@[A-Za-z_]\w*|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b/g;

    let html = "";
    let last = 0;
    let previous = null;

    for (const match of source.matchAll(token)) {
        html += escapeHtml(source.slice(last, match.index));

        const text = match[0];
        let type = null;

        if (text.startsWith("#"))
            type = "comment";

        else if (text.startsWith('"') || text.startsWith("'"))
            type = "string";

        else if (text.startsWith("@"))
            type = "decorator";

        else if (/^\d/.test(text))
            type = "number";

        else if (previous === "def")
            type = "function";

        else if (previous === "class")
            type = "class";

        else if (keywords.has(text))
            type = "keyword";

        else if (literals.has(text))
            type = "literal";

        else if (builtins.has(text))
            type = "builtin";

        else if (text === "self" || text === "cls")
            type = "special";

        html += type
            ? `<span class="syn-${type}">${escapeHtml(text)}</span>`
            : escapeHtml(text);

        previous = text;
        last = match.index + text.length;
    }
const lines = html.split("\n");

block.innerHTML = lines.map(line => {
    // Get the plain-text version so HTML highlighting
    // doesn't interfere with counting indentation.
    const temp = document.createElement("div");
    temp.innerHTML = line;
    const text = temp.textContent;

    // Count leading spaces
    const match = text.match(/^ */);
    const spaces = match ? match[0].length : 0;

    /*
     * Wrapped text starts:
     *   - 4 characters in for unindented lines
     *   - 4 characters beyond the existing indentation
     */
    const continuation = spaces + 4;

    return `<span class="code-line"
                  style="--continuation:${continuation}ch">${line || "&nbsp;"}</span>`;
}).join("");
});

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
</script>
